<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations</title>
    <link href="anim.css" rel="stylesheet" type="text/css">
</head>
<body>
    <section>
        <h1 class="animate bounce">Hello, World!</h1>
        <h2 class="animate slideInRigth animate--slow">Hello, World!</h2>
        <h3 class="animate rotate animate--slow animate--infinite">Hello, World!</h3>
    </section>
    
</body>
</html>
